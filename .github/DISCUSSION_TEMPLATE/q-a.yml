title: "Tanya Jawab: "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        ## Ajukan Pertanyaan
        
        Gunakan template ini untuk bertanya tentang OpenOps Toolkit.
        
        Sebelum bertanya, silakan:
        1. Cek [dokumentasi](docs/)
        2. Cari [diskusi yang sudah ada](https://github.com/openops-toolkit/openops-toolkit/discussions)
        3. Cari [issue yang sudah ada](https://github.com/openops-toolkit/openops-toolkit/issues)

  - type: textarea
    id: question
    attributes:
      label: Pertanyaan
      description: Apa pertanyaan Anda?
      placeholder: Tulis pertanyaan di sini...
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: Konteks
      description: Informasi tambahan yang relevan
      placeholder: |
        - Apa yang sedang Anda coba lakukan?
        - Sudah mencoba apa saja?
        - Error apa yang muncul?
    validations:
      required: false

  - type: dropdown
    id: component
    attributes:
      label: Komponen
      description: Pertanyaan ini tentang komponen mana?
      options:
        - Ansible
        - n8n
        - Monitoring
        - Scripts
        - Dokumentasi
        - Umum
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Lingkungan
      description: Sistem yang digunakan
      placeholder: |
        - OS: [contoh: Ubuntu 22.04]
        - Versi: [contoh: 0.1.0]
        - Node.js: [contoh: 18.x]
    validations:
      required: false

title: "Ide: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        ## Bagikan Ide Anda
        
        Gunakan template ini untuk menyampaikan ide perbaikan OpenOps Toolkit.
        
        Sebelum mengirim, silakan:
        1. Cek [roadmap](ROADMAP.md)
        2. Cari [diskusi yang sudah ada](https://github.com/openops-toolkit/openops-toolkit/discussions)
        3. Cari [issue yang sudah ada](https://github.com/openops-toolkit/openops-toolkit/issues)

  - type: textarea
    id: idea
    attributes:
      label: Ide
      description: Apa ide Anda?
      placeholder: Jelaskan idenya di sini...
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Masalah
      description: Masalah apa yang diatasi oleh ide ini?
      placeholder: |
        - Situasi saat ini seperti apa?
        - Apa kendalanya?
        - Bagaimana ide ini membantu?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Solusi yang Diusulkan
      description: Bagaimana cara mewujudkannya?
      placeholder: |
        - Bentuk solusinya seperti apa?
        - Cara kerjanya bagaimana?
        - Fitur utamanya apa saja?
    validations:
      required: false

  - type: dropdown
    id: component
    attributes:
      label: Komponen
      description: Untuk komponen mana ide ini?
      options:
        - Ansible
        - n8n
        - Monitoring
        - Scripts
        - Dokumentasi
        - Umum
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Prioritas
      description: Seberapa penting ide ini?
      options:
        - Rendah
        - Sedang
        - Tinggi
        - Kritis
    validations:
      required: true

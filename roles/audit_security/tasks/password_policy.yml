---
# Audit Security — Password Policy

- name: Audit Security — Check password policy
  ansible.builtin.shell: |
    if [ -f /etc/security/pwquality.conf ]; then
      minlen=$(grep -E "^minlen" /etc/security/pwquality.conf 2>/dev/null | awk -F= '{print $2}' | tr -d ' ')
      if [ -n "$minlen" ] && [ "$minlen" -ge 12 ] 2>/dev/null; then
        echo "strong:$minlen"
      else
        echo "weak:${minlen:-unset}"
      fi
    else
      echo "missing:0"
    fi
  register: audit_pw_quality
  changed_when: false
  failed_when: false

- name: Audit Security — Set password policy result
  ansible.builtin.set_fact:
    audit_results: >-
      {{ audit_results + [{
           'id': 'password_policy',
           'category': 'security',
           'name': 'Password Policy',
           'severity': 'MEDIUM',
           'status': 'PASS' if (audit_pw_quality.stdout | split(':') | first == 'strong') else 'FAIL',
           'message': 'Strong password policy (minlen=' ~ (audit_pw_quality.stdout | split(':') | last) ~ ')' if (audit_pw_quality.stdout | split(':') | first == 'strong') else 'Weak or missing password policy',
           'details': {'minlen': audit_pw_quality.stdout | split(':') | last},
           'recommendation': '' if (audit_pw_quality.stdout | split(':') | first == 'strong') else 'Configure /etc/security/pwquality.conf with minlen >= 12'
         }] }}"
